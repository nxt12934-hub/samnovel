<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無廣告個人小說書庫 (多檔案獨立架構)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto+Sans+TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- 頂部導覽列 (進入閱讀介面時會自動隱藏) -->
    <header id="appHeader" class="bg-slate-800 border-b border-slate-700 shadow-md sticky top-0 z-40 hidden">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="goHome()">
                <span class="text-2xl">📚</span>
                <div>
                    <h1 class="text-xl font-bold tracking-wider">無廣告小說書庫</h1>
                    <p class="text-[10px] text-indigo-400 font-mono" id="syncStatus">狀態：多檔案架構準備就緒</p>
                </div>
            </div>
            <!-- 功能按鈕與搜尋 -->
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <input type="text" id="searchInput" placeholder="搜尋書名或標籤..." class="bg-slate-700 text-slate-100 px-4 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-48">
                
                <button onclick="loadLibraryIndex()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-2 rounded-lg text-sm transition shadow" title="從 GitHub 重新同步索引">
                    🔄 同步索引
                </button>
                <button onclick="exportAll()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-2 rounded-lg text-sm transition shadow" title="下載索引與變更檔案">
                    📥 下載備份
                </button>
                <button onclick="logout()" class="bg-rose-900/50 hover:bg-rose-900 text-rose-200 px-3 py-2 rounded-lg text-sm transition shadow" title="登出鎖定">
                    🔒 登出
                </button>

                <button onclick="openBookModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition whitespace-nowrap shadow">
                    + 新增小說
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full flex flex-col justify-center">
        <div id="viewArea"></div>
    </main>

    <!-- 新增/編輯小說互動視窗 -->
    <div id="bookModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-md shadow-2xl">
            <h2 id="modalTitle" class="text-lg font-bold mb-4 text-slate-100">新增小說</h2>
            <form id="bookForm" onsubmit="saveBook(event)" class="space-y-4">
                <input type="hidden" id="bookId">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">小說書名</label>
                    <input type="text" id="bookTitleInput" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">參考閱讀網址 (URL)</label>
                    <input type="url" id="bookUrlInput" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">分類</label>
                    <select id="bookCategoryInput" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                        <option value="輕小說 / 異世界">輕小說 / 異世界</option>
                        <option value="玄幻修真">玄幻修真</option>
                        <option value="都市科幻">都市科幻</option>
                        <option value="歷史軍事">歷史軍事</option>
                        <option value="懸疑驚悚">懸疑驚悚</option>
                        <option value="言情">言情</option>
                        <option value="其他 / 收藏">其他 / 收藏</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">簡介 / 備註</label>
                    <textarea id="bookDescInput" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeBookModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-2 rounded-lg text-sm transition">取消</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">儲存並產生檔案</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 新增/編輯章節互動視窗 -->
    <div id="chapterModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-2xl shadow-2xl max-h-[90vh] flex flex-col">
            <h2 id="chapterModalTitle" class="text-lg font-bold mb-4 text-slate-100">新增離線章節</h2>
            <form id="chapterForm" onsubmit="saveChapter(event)" class="space-y-4 flex-grow flex flex-col">
                <input type="hidden" id="chapterId">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">章節標題</label>
                    <input type="text" id="chapterTitleInput" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="flex-grow flex flex-col">
                    <label class="block text-xs font-medium text-slate-400 mb-1">章節內文</label>
                    <textarea id="chapterContentInput" rows="12" required placeholder="在此貼上小說章節內文..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 flex-grow font-sans leading-relaxed"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeChapterModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-2 rounded-lg text-sm transition">取消</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">儲存章節</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-xs text-slate-400 mt-auto">
        <p>© 2026 牟家慶 獨立製作</p>
    </footer>

    <!-- JavaScript 核心邏輯 -->
    <script>
        const MY_PASSWORD = "1234"; // 預設解鎖密碼
        const INDEX_URL = './index.json';

        let bookIndex = []; // 存放所有小說的索引清單
        let currentBookData = null; // 當前正在檢閱/閱讀的單書詳細資料 (包含 chapters)
        let currentView = 'home';
        let activeBookId = null;
        let activeChapterId = null;
        let currentCategory = '全部';
        let fontSize = 18;
        let readerTheme = localStorage.getItem('reader_theme') || 'dark'; // 'dark' 或 'light'
        let chapterSortOrder = 'asc'; // 'asc' 正序 | 'desc' 倒序

        let readingHistory = JSON.parse(localStorage.getItem('novel_history')) || {};
        const categories = ['全部', '輕小說 / 異世界', '玄幻修真', '都市科幻', '歷史軍事', '懸疑驚悚', '言情', '其他 / 收藏'];

        function checkAuth() {
            return sessionStorage.getItem('novel_auth') === 'true';
        }

        function handleLogin(e) {
            e.preventDefault();
            const inputPwd = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');

            if (inputPwd === MY_PASSWORD) {
                sessionStorage.setItem('novel_auth', 'true');
                bootApp();
            } else {
                errorMsg.classList.remove('hidden');
                document.getElementById('passwordInput').value = '';
            }
        }

        function logout() {
            sessionStorage.removeItem('novel_auth');
            bootApp();
        }

        function renderLoginScreen() {
            document.getElementById('appHeader').classList.add('hidden');
            const container = document.getElementById('viewArea');
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl my-12 w-full">
                    <div class="text-center mb-6">
                        <span class="text-4xl">📚</span>
                        <h2 class="text-xl font-bold text-slate-100 mt-2">個人小說書庫解鎖</h2>
                        <p class="text-xs text-slate-400 mt-1">請輸入密碼以進入書庫 (預設: 1234)</p>
                    </div>
                    <form onsubmit="handleLogin(event)" class="space-y-4">
                        <div>
                            <input type="password" id="passwordInput" required placeholder="請輸入密碼..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 text-center tracking-widest">
                        </div>
                        <div id="errorMsg" class="text-xs text-rose-400 text-center hidden">密碼錯誤，請重新輸入！</div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-lg text-sm font-medium transition shadow">
                            進入書庫
                        </button>
                    </form>
                </div>
            `;
        }

        function bootApp() {
            if (!checkAuth()) {
                renderLoginScreen();
                return;
            }
            
            const localIndex = localStorage.getItem('my_novels_index');
            if (localIndex) {
                try { bookIndex = JSON.parse(localIndex); } catch(e) {}
            }
            
            if (!bookIndex || bookIndex.length === 0) {
                bookIndex = [
                    {
                        id: 1,
                        title: '範例小說',
                        url: '',
                        category: '輕小說 / 異世界',
                        desc: '示範書籍',
                        path: 'books/book_1.json',
                        chapterCount: 1
                    }
                ];
                // 順便建立範例單書快取
                localStorage.setItem('book_cache_1', JSON.stringify({
                    id: 1,
                    title: '範例小說',
                    url: '',
                    category: '輕小說 / 異世界',
                    desc: '示範書籍',
                    chapters: [{ id: 101, title: '第一章', content: '內容範例' }]
                }));
            }
            
            render();
            loadLibraryIndex();
        }

        // 載入總索引檔 index.json
        async function loadLibraryIndex() {
            const statusEl = document.getElementById('syncStatus');
            try {
                const response = await fetch(INDEX_URL + '?t=' + Date.now());
                if (response.ok) {
                    const remoteIndex = await response.json();
                    if (Array.isArray(remoteIndex) && remoteIndex.length > 0) {
                        bookIndex = remoteIndex;
                        localStorage.setItem('my_novels_index', JSON.stringify(bookIndex));
                        if(statusEl) statusEl.textContent = '狀態：索引已同步雲端';
                        render();
                    }
                }
            } catch (err) {
                if(statusEl) statusEl.textContent = '狀態：使用本機索引快取';
            }
        }

        // 非同步載入指定的單書 JSON 檔案
        async function loadBookData(bookId, callback) {
            const indexItem = bookIndex.find(b => b.id === bookId);
            if (!indexItem) return;

            // 先檢查本機快取
            const cachedBook = localStorage.getItem(`book_cache_${bookId}`);
            if (cachedBook) {
                try {
                    currentBookData = JSON.parse(cachedBook);
                    if (callback) callback();
                } catch(e) {}
            }

            // 從雲端載入最新單書檔案
            try {
                const res = await fetch(`./${indexItem.path}?t=` + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    currentBookData = data;
                    localStorage.setItem(`book_cache_${bookId}`, JSON.stringify(data));
                    if (callback) callback();
                }
            } catch(err) {
                console.error("無法載入單書檔案", err);
                if (!currentBookData) {
                    alert('無法載入該小說的章節內容檔案，請確認該 JSON 檔已上傳至對應目錄！');
                    goHome();
                }
            }
        }

        function saveIndexData() {
            localStorage.setItem('my_novels_index', JSON.stringify(bookIndex));
        }

        function saveCurrentBookData() {
            if (!currentBookData) return;
            localStorage.setItem(`book_cache_${currentBookData.id}`, JSON.stringify(currentBookData));
            
            // 同步更新索引中的章節數量與描述
            const idx = bookIndex.findIndex(b => b.id === currentBookData.id);
            if (idx !== -1) {
                bookIndex[idx].title = currentBookData.title;
                bookIndex[idx].category = currentBookData.category;
                bookIndex[idx].desc = currentBookData.desc;
                bookIndex[idx].url = currentBookData.url;
                bookIndex[idx].chapterCount = currentBookData.chapters ? currentBookData.chapters.length : 0;
            }
            saveIndexData();

            // 自動下載該書的 JSON 檔以及 index.json 供您更新到 GitHub
            downloadJsonFile(currentBookData, `book_${currentBookData.id}.json`);
            downloadJsonFile(bookIndex, 'index.json');
            alert(`已自動產生並下載「${currentBookData.title}.json」以及更新後的「index.json」！請將它們上傳至 GitHub 倉庫對應位置。`);
        }

        function downloadJsonFile(dataObj, fileName) {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataObj, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", fileName);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function exportAll() {
            downloadJsonFile(bookIndex, 'index.json');
            alert('已下載 index.json 總索引檔！若修改了特定書籍，請在該書目錄中下載對應的單書檔案。');
        }

        function goHome() {
            currentView = 'home';
            activeBookId = null;
            activeChapterId = null;
            currentBookData = null;
            render();
        }

        function render() {
            if (!checkAuth()) {
                renderLoginScreen();
                return;
            }

            const header = document.getElementById('appHeader');
            if (currentView === 'reader') {
                header.classList.add('hidden');
            } else {
                header.classList.remove('hidden');
            }

            const container = document.getElementById('viewArea');
            container.innerHTML = '';

            if (currentView === 'home') {
                renderHome(container);
            } else if (currentView === 'chapters') {
                renderChapters(container);
            } else if (currentView === 'reader') {
                renderReader(container);
            }
        }

        function renderHome(container) {
            const searchKeyword = document.getElementById('searchInput') ? document.getElementById('searchInput').value.toLowerCase() : '';
            
            let catButtonsHtml = categories.map(cat => `
                <button onclick="filterCategory('${cat}')" class="cat-btn ${currentCategory === cat ? 'bg-indigo-600 text-white' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'} px-4 py-1.5 rounded-full text-sm font-medium transition">${cat}</button>
            `).join('');

            container.innerHTML = `
                <div id="categoryFilters" class="flex flex-wrap gap-2 mb-8">${catButtonsHtml}</div>
                <div id="bookGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
            `;

            const grid = document.getElementById('bookGrid');
            const filtered = bookIndex.filter(book => {
                const matchCat = (currentCategory === '全部' || book.category === currentCategory);
                const matchSearch = book.title.toLowerCase().includes(searchKeyword) || (book.desc && book.desc.toLowerCase().includes(searchKeyword));
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">找不到相關的小說。</div>`;
                return;
            }

            filtered.forEach(book => {
                const history = readingHistory[book.id];
                const card = document.createElement('div');
                card.className = "bg-slate-800 border border-slate-700 rounded-xl p-5 flex flex-col justify-between hover:border-indigo-500 transition group shadow-md";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <span class="text-xs bg-indigo-950 text-indigo-300 border border-indigo-800 px-2 py-0.5 rounded">${book.category}</span>
                            <div class="flex gap-2">
                                <button onclick="openEditBookModal(${book.id})" class="text-slate-400 hover:text-indigo-400 text-xs transition" title="編輯">✎</button>
                                <button onclick="deleteBook(${book.id})" class="text-slate-500 hover:text-rose-400 text-xs transition" title="刪除">✕</button>
                            </div>
                        </div>
                        <h3 class="font-bold text-base text-slate-100 group-hover:text-indigo-400 transition mb-1 cursor-pointer" onclick="openBookChapters(${book.id})">${escapeHtml(book.title)}</h3>
                        <p class="text-xs text-slate-400 line-clamp-2 mb-3">${escapeHtml(book.desc || '無備註說明')}</p>
                        
                        <div class="text-xs text-slate-300 mb-4 bg-slate-900/60 px-3 py-2 rounded border border-slate-700/60 flex flex-col gap-1">
                            <div class="flex justify-between items-center text-slate-400">
                                <span>離線章節：<strong class="text-indigo-400">${book.chapterCount || 0}</strong> 篇</span>
                            </div>
                            <div class="pt-1 border-t border-slate-800 flex items-center justify-between">
                                <span class="text-[11px] text-slate-400">上次觀看：</span>
                                ${history ? `
                                    <button onclick="resumeReading(${book.id}, ${history.chapterId})" class="text-indigo-400 hover:text-indigo-300 font-medium truncate max-w-[140px] text-left underline" title="${escapeHtml(history.chapterTitle)}">
                                        ${escapeHtml(history.chapterTitle)}
                                    </button>
                                ` : '<span class="text-slate-500 italic text-[11px]">尚未閱讀</span>'}
                            </div>
                        </div>
                    </div>
                    <div class="pt-3 border-t border-slate-700/60 flex justify-between items-center">
                        <button onclick="openBookChapters(${book.id})" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded font-medium transition flex items-center gap-1 shadow">
                            📖 目錄 / 閱讀
                        </button>
                        ${book.url ? `<a href="${escapeHtml(book.url)}" target="_blank" rel="noopener noreferrer" class="text-xs text-slate-400 hover:text-slate-200 transition" title="前往原網站">外部連結 ↗</a>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 章節列表頁面
        function renderChapters(container) {
            const book = currentBookData;
            if (!book) { goHome(); return; }

            container.innerHTML = `
                <div class="mb-6 flex items-center justify-between flex-wrap gap-4">
                    <div>
                        <button onclick="goHome()" class="text-xs text-indigo-400 hover:underline mb-2 inline-block">← 返回書櫃</button>
                        <h2 class="text-2xl font-bold text-slate-100">${escapeHtml(book.title)}</h2>
                        <p class="text-xs text-slate-400 mt-1">${escapeHtml(book.desc || '')}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="toggleSortOrder()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-3 py-2 rounded-lg text-sm transition shadow flex items-center gap-1">
                            ${chapterSortOrder === 'asc' ? '🔽 順序排列 (正序)' : '🔼 倒序排列 (反序)'}
                        </button>
                        <button onclick="openChapterModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow">
                            + 新增離線章節
                        </button>
                    </div>
                </div>

                <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-md">
                    <div class="px-6 py-4 border-b border-slate-700 font-bold text-sm text-slate-300 flex justify-between items-center">
                        <span>章節目錄清單</span>
                        <span class="text-xs text-slate-400 font-normal">共 ${book.chapters ? book.chapters.length : 0} 篇</span>
                    </div>
                    <div id="chapterList" class="divide-y divide-slate-700/60"></div>
                </div>
            `;

            const listEl = document.getElementById('chapterList');
            if (!book.chapters || book.chapters.length === 0) {
                listEl.innerHTML = `<div class="p-8 text-center text-slate-500 text-sm">目前尚無離線章節，點擊右上角新增。</div>`;
                return;
            }

            let displayChapters = [...book.chapters];
            if (chapterSortOrder === 'desc') {
                displayChapters.reverse();
            }

            displayChapters.forEach((chap, idx) => {
                const itemNumber = chapterSortOrder === 'asc' ? (idx + 1) : (book.chapters.length - idx);
                const item = document.createElement('div');
                item.className = "px-6 py-3.5 flex justify-between items-center hover:bg-slate-700/40 transition";
                item.innerHTML = `
                    <div class="cursor-pointer flex-grow flex items-center gap-3" onclick="readChapter(${book.id}, ${chap.id})">
                        <span class="text-xs text-slate-500 font-mono">#${itemNumber}</span>
                        <span class="text-sm font-medium text-slate-200 hover:text-indigo-400 transition">${escapeHtml(chap.title)}</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="readChapter(${book.id}, ${chap.id})" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium">閱讀</button>
                        <button onclick="openEditChapterModal(${chap.id})" class="text-xs text-slate-400 hover:text-slate-200">編輯</button>
                        <button onclick="deleteChapter(${chap.id})" class="text-xs text-slate-500 hover:text-rose-400">刪除</button>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function toggleSortOrder() {
            chapterSortOrder = chapterSortOrder === 'asc' ? 'desc' : 'asc';
            renderChapters(document.getElementById('viewArea'));
        }

        // 閱讀器
        function renderReader(container) {
            const book = currentBookData;
            const chapter = book ? book.chapters.find(c => c.id === activeChapterId) : null;
            if (!book || !chapter) { goHome(); return; }

            const chapters = book.chapters;
            const currentIndex = chapters.findIndex(c => c.id === activeChapterId);
            const prevChap = currentIndex > 0 ? chapters[currentIndex - 1] : null;
            const nextChap = currentIndex < chapters.length - 1 ? chapters[currentIndex + 1] : null;

            const isLight = readerTheme === 'light';
            const bgClass = isLight ? 'bg-white text-slate-900 border-slate-200' : 'bg-slate-800 text-slate-200 border-slate-700';
            const topBarClass = isLight ? 'bg-slate-100 text-slate-800 border-slate-200' : 'bg-slate-800 text-slate-300 border-slate-700';
            const btnClass = isLight ? 'bg-slate-200 hover:bg-slate-300 text-slate-700' : 'bg-slate-700 hover:bg-slate-600 text-slate-300';
            const selectClass = isLight ? 'bg-white text-slate-800 border-slate-300' : 'bg-slate-900 text-slate-200 border-slate-700';

            let chapterOptions = chapters.map(c => `
                <option value="${c.id}" ${c.id === chapter.id ? 'selected' : ''}>${escapeHtml(c.title)}</option>
            `).join('');

            container.innerHTML = `
                <div class="w-full">
                    <div class="flex justify-between items-center mb-6 border px-6 py-3.5 rounded-xl shadow-md gap-4 flex-wrap ${topBarClass}">
                        <button onclick="openBookChapters(${book.id})" class="text-sm text-indigo-500 font-medium hover:underline whitespace-nowrap">← 返回目錄</button>
                        
                        <div class="flex-grow max-w-xs sm:max-w-md">
                            <select onchange="switchChapter(this.value)" class="w-full text-xs sm:text-sm rounded-lg px-3 py-2 border focus:outline-none focus:ring-2 focus:ring-indigo-500 truncate ${selectClass}">
                                ${chapterOptions}
                            </select>
                        </div>

                        <div class="flex items-center gap-2 sm:gap-3 flex-wrap justify-end">
                            <button onclick="toggleReaderTheme()" class="px-3 py-1.5 rounded text-xs sm:text-sm transition font-medium ${btnClass}">
                                ${isLight ? '🌙 深色' : '☀️ 白底'}
                            </button>
                            <span class="text-xs sm:text-sm opacity-75">字體：</span>
                            <button onclick="changeFontSize(-2)" class="px-2.5 py-1.5 rounded text-xs sm:text-sm transition ${btnClass}">A-</button>
                            <button onclick="changeFontSize(2)" class="px-2.5 py-1.5 rounded text-xs sm:text-sm transition ${btnClass}">A+</button>
                        </div>
                    </div>

                    <article class="border rounded-2xl p-8 sm:p-14 shadow-2xl mb-6 ${bgClass}">
                        <h2 class="text-2xl sm:text-3xl font-bold mb-8 pb-4 border-b ${isLight ? 'border-slate-200' : 'border-slate-700'}">${escapeHtml(chapter.title)}</h2>
                        <div id="readerContent" class="leading-loose whitespace-pre-wrap font-sans" style="font-size: ${fontSize}px;">${escapeHtml(chapter.content)}</div>
                    </article>

                    <div class="flex justify-between items-center pb-6">
                        <button ${prevChap ? `onclick="readChapter(${book.id}, ${prevChap.id})"` : 'disabled'} class="border px-6 py-3 rounded-xl text-sm font-medium transition ${prevChap ? btnClass : 'opacity-40 cursor-not-allowed border-transparent bg-slate-800/50 text-slate-500'}">
                            ← 上一章
                        </button>
                        <button ${nextChap ? `onclick="readChapter(${book.id}, ${nextChap.id})"` : 'disabled'} class="border px-6 py-3 rounded-xl text-sm font-medium transition ${nextChap ? btnClass : 'opacity-40 cursor-not-allowed border-transparent bg-slate-800/50 text-slate-500'}">
                            下一章 →
                        </button>
                    </div>
                </div>
            `;
        }

        function switchChapter(chapId) {
            readChapter(activeBookId, Number(chapId));
        }

        function toggleReaderTheme() {
            readerTheme = readerTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('reader_theme', readerTheme);
            render();
        }

        function openBookModal() {
            document.getElementById('modalTitle').textContent = '新增小說';
            document.getElementById('bookForm').reset();
            document.getElementById('bookId').value = '';
            document.getElementById('bookModal').classList.remove('hidden');
            document.getElementById('bookModal').classList.add('flex');
        }

        function openEditBookModal(id) {
            loadBookData(id, () => {
                const book = currentBookData;
                if (!book) return;
                document.getElementById('modalTitle').textContent = '編輯小說';
                document.getElementById('bookId').value = book.id;
                document.getElementById('bookTitleInput').value = book.title;
                document.getElementById('bookUrlInput').value = book.url || '';
                document.getElementById('bookCategoryInput').value = book.category;
                document.getElementById('bookDescInput').value = book.desc || '';
                document.getElementById('bookModal').classList.remove('hidden');
                document.getElementById('bookModal').classList.add('flex');
            });
        }

        function closeBookModal() {
            document.getElementById('bookModal').classList.add('hidden');
            document.getElementById('bookModal').classList.remove('flex');
        }

        function saveBook(e) {
            e.preventDefault();
            const id = document.getElementById('bookId').value;
            const title = document.getElementById('bookTitleInput').value;
            const url = document.getElementById('bookUrlInput').value;
            const category = document.getElementById('bookCategoryInput').value;
            const desc = document.getElementById('bookDescInput').value;

            if (id) {
                // 編輯現有書籍
                loadBookData(Number(id), () => {
                    if (currentBookData) {
                        currentBookData.title = title;
                        currentBookData.url = url;
                        currentBookData.category = category;
                        currentBookData.desc = desc;
                        saveCurrentBookData();
                    }
                    closeBookModal();
                    render();
                });
            } else {
                // 新增書籍
                const newId = Date.now();
                currentBookData = {
                    id: newId,
                    title: title,
                    url: url,
                    category: category,
                    desc: desc,
                    chapters: []
                };
                bookIndex.push({
                    id: newId,
                    title: title,
                    url: url,
                    category: category,
                    desc: desc,
                    path: `books/book_${newId}.json`,
                    chapterCount: 0
                });
                saveCurrentBookData();
                closeBookModal();
                render();
            }
        }

        function deleteBook(id) {
            if (confirm('確定要刪除這本書嗎？')) {
                bookIndex = bookIndex.filter(b => b.id !== id);
                saveIndexData();
                localStorage.removeItem(`book_cache_${id}`);
                delete readingHistory[id];
                localStorage.setItem('novel_history', JSON.stringify(readingHistory));
                downloadJsonFile(bookIndex, 'index.json');
                alert('已從索引中移除該書，並下載更新後的 index.json！');
                render();
            }
        }

        function openBookChapters(bookId) {
            activeBookId = bookId;
            loadBookData(bookId, () => {
                currentView = 'chapters';
                render();
            });
        }

        function openChapterModal() {
            document.getElementById('chapterModalTitle').textContent = '新增離線章節';
            document.getElementById('chapterForm').reset();
            document.getElementById('chapterId').value = '';
            document.getElementById('chapterModal').classList.remove('hidden');
            document.getElementById('chapterModal').classList.add('flex');
        }

        function openEditChapterModal(chapId) {
            const chap = currentBookData.chapters.find(c => c.id === chapId);
            if (!chap) return;
            document.getElementById('chapterModalTitle').textContent = '編輯章節';
            document.getElementById('chapterId').value = chap.id;
            document.getElementById('chapterTitleInput').value = chap.title;
            document.getElementById('chapterContentInput').value = chap.content;
            document.getElementById('chapterModal').classList.remove('hidden');
            document.getElementById('chapterModal').classList.add('flex');
        }

        function closeChapterModal() {
            document.getElementById('chapterModal').classList.add('hidden');
            document.getElementById('chapterModal').classList.remove('flex');
        }

        function saveChapter(e) {
            e.preventDefault();
            const chapId = document.getElementById('chapterId').value;
            const title = document.getElementById('chapterTitleInput').value;
            const content = document.getElementById('chapterContentInput').value;

            if (chapId) {
                const chap = currentBookData.chapters.find(c => c.id == chapId);
                if (chap) { chap.title = title; chap.content = content; }
            } else {
                if (!currentBookData.chapters) currentBookData.chapters = [];
                currentBookData.chapters.push({ id: Date.now(), title, content });
            }
            saveCurrentBookData();
            closeChapterModal();
            renderChapters(document.getElementById('viewArea'));
        }

        function deleteChapter(chapId) {
            if (confirm('確定要刪除這個章節嗎？')) {
                currentBookData.chapters = currentBookData.chapters.filter(c => c.id !== chapId);
                saveCurrentBookData();
                renderChapters(document.getElementById('viewArea'));
            }
        }

        function readChapter(bookId, chapId) {
            activeBookId = bookId;
            activeChapterId = chapId;
            loadBookData(bookId, () => {
                currentView = 'reader';
                const book = currentBookData;
                if (book && book.chapters) {
                    const chap = book.chapters.find(c => c.id === chapId);
                    if (chap) {
                        readingHistory[bookId] = {
                            chapterId: chap.id,
                            chapterTitle: chap.title,
                            timestamp: Date.now()
                        };
                        localStorage.setItem('novel_history', JSON.stringify(readingHistory));
                    }
                }
                render();
                window.scrollTo(0, 0);
            });
        }

        function resumeReading(bookId, chapId) {
            readChapter(bookId, chapId);
        }

        function changeFontSize(delta) {
            fontSize = Math.max(14, Math.min(28, fontSize + delta));
            const el = document.getElementById('readerContent');
            if (el) el.style.fontSize = fontSize + 'px';
        }

        function filterCategory(cat) {
            currentCategory = cat;
            render();
        }

        const searchInput = document.getElementById('searchInput');
        if(searchInput) searchInput.addEventListener('input', render);

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // 啟動初始化檢查
        bootApp();
    </script>
</body>
</html>
